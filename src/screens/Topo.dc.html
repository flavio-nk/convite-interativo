<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Topo</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
.tp-link:hover{background:#F1EFF8}
.tp-btn:focus-visible,.tp-link:focus-visible{outline:2px solid #5B3FD6;outline-offset:2px}
</style>
</helmet>
<header style="background: #FFFFFF; border-bottom: 1px solid #E3E1EA; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #17151F; position: relative; z-index: 20">
  <div style="max-width: 1200px; margin: 0 auto; padding: 10px 20px; display: flex; align-items: center; gap: 16px 28px; min-height: 64px; box-sizing: border-box">
    <a href="Main.dc.html" style="display: flex; align-items: center; gap: 10px; color: #17151F; text-decoration: none; flex: none">
      <span style="width: 32px; height: 32px; border-radius: 9px; background: #5B3FD6; color: #FFFFFF; display: flex; align-items: center; justify-content: center">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="m3 7 9 6 9-6"></path></svg>
      </span>
      <span style="font-weight: 700; font-size: 17px; letter-spacing: -0.01em">Convite Interativo</span>
    </a>
    <sc-if value="{{wide}}" hint-placeholder-val="{{ true }}">
      <nav aria-label="Principal" style="display: flex; gap: 4px; flex: 1 1 auto">
        <sc-for list="{{links}}" as="l" hint-placeholder-count="3">
          <a class="tp-link" href="{{l.href}}" aria-current="{{l.current}}" style="padding: 9px 14px; border-radius: 9px; background: {{l.bg}}; color: {{l.fg}}; font-weight: {{l.weight}}; font-size: 15px; text-decoration: none">{{l.label}}</a>
        </sc-for>
      </nav>
    </sc-if>
    <sc-if value="{{narrow}}" hint-placeholder-val="{{ false }}"><span style="flex: 1"></span></sc-if>
    <div style="position: relative; flex: none">
      <button class="tp-btn" data-testid="user-menu" onClick="{{toggle}}" aria-expanded="{{openAttr}}" aria-label="{{menuAria}}" style="display: flex; align-items: center; gap: 8px; min-height: 44px; padding: {{btnPad}}; border-radius: 999px; border: 1px solid #E3E1EA; background: #FFFFFF; color: #17151F; cursor: pointer; font: inherit">
        <sc-if value="{{narrow}}" hint-placeholder-val="{{ false }}">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg>
        </sc-if>
        <sc-if value="{{wide}}" hint-placeholder-val="{{ true }}">
          <span aria-hidden="true" style="width: 32px; height: 32px; border-radius: 50%; background: #EFECFB; color: #3B26A8; display: inline-flex; align-items: center; justify-content: center; font-weight: 800; font-size: 13px">{{initials}}</span>
          <span style="display: flex; flex-direction: column; align-items: flex-start; line-height: 1.2"><strong style="font-size: 14px">{{name}}</strong><span style="font-size: 12px; color: #5E5A6B">{{role}}</span></span>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg>
        </sc-if>
      </button>
      <sc-if value="{{open}}" hint-placeholder-val="{{ false }}">
        <div role="menu" onKeyDown="{{onKey}}" style="position: absolute; right: 0; top: 52px; width: 250px; padding: 6px; border-radius: 14px; background: #FFFFFF; border: 1px solid #E3E1EA; box-shadow: 0 14px 36px rgba(23, 21, 31, 0.16); display: flex; flex-direction: column">
          <div style="padding: 10px 12px; border-bottom: 1px solid #EEEDF3; margin-bottom: 4px; line-height: 1.3"><strong style="display: block; font-size: 14px">{{name}}</strong><span style="font-size: 12px; color: #5E5A6B">{{role}}</span></div>
          <sc-if value="{{narrow}}" hint-placeholder-val="{{ false }}">
            <sc-for list="{{links}}" as="l" hint-placeholder-count="3">
              <a class="tp-link" role="menuitem" href="{{l.href}}" aria-current="{{l.current}}" style="display: flex; align-items: center; min-height: 44px; padding: 0 12px; border-radius: 9px; color: {{l.fg}}; font-weight: {{l.weight}}; font-size: 15px; text-decoration: none; background: {{l.bg}}">{{l.label}}</a>
            </sc-for>
            <span style="height: 1px; background: #EEEDF3; margin: 4px 0"></span>
          </sc-if>
          <button role="menuitem" class="tp-btn" onClick="{{logout}}" style="display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 12px; border: 0; border-radius: 9px; background: transparent; color: #B42318; font: inherit; font-weight: 600; font-size: 15px; cursor: pointer; text-align: left">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 4h4v16h-4M10 8l-4 4 4 4M6 12h10"></path></svg>
            Sair
          </button>
        </div>
      </sc-if>
    </div>
  </div>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"text","default":"convites"},"onLogout":{"editor":null},"$preview":{"width":1280,"height":64}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { open: false, w: typeof window !== 'undefined' ? window.innerWidth : 1280 };
  }
  componentDidMount() {
    this.onResize = () => this.setState({ w: window.innerWidth });
    window.addEventListener('resize', this.onResize);
    // clique fora fecha o menu
    this.onDoc = (e) => { if (this.state.open && !(e.target.closest && e.target.closest('[data-testid="user-menu"], [role="menu"]'))) this.setState({ open: false }); };
    document.addEventListener('pointerdown', this.onDoc);
  }
  componentWillUnmount() {
    window.removeEventListener('resize', this.onResize);
    document.removeEventListener('pointerdown', this.onDoc);
  }
  renderVals() {
    const u = api.user() || {};
    const narrow = this.state.w < 760;
    const active = this.props.active || 'convites';
    // conta de cliente: só "Meus convites" (não cria temas)
    const defs = api.isClient() ? [['convites', 'Meus convites', '#/Main']] : [['convites', 'Convites', '#/Main'], ['temas', 'Temas', '#/Temas']];
    if (api.isAdmin()) defs.push(['usuarios', 'Usuários', '#/Usuarios']);
    const name = u.name || u.username || '';
    const ini = name.split(/\s+/).filter(Boolean).map((w) => w[0]).slice(0, 2).join('').toUpperCase() || '?';
    return {
      narrow, wide: !narrow,
      links: defs.map((d) => {
        const on = d[0] === active;
        return { label: d[1], href: d[2], current: on ? 'page' : 'false', bg: on ? '#EFECFB' : 'transparent', fg: on ? '#3B26A8' : '#3D3A4A', weight: on ? '700' : '500' };
      }),
      name, initials: ini, role: u.role === 'admin' ? 'Administrador' : (u.role === 'cliente' ? 'Cliente' : 'Usuário'),
      open: this.state.open, openAttr: this.state.open ? 'true' : 'false',
      btnPad: narrow ? '0 10px' : '4px 12px 4px 4px',
      menuAria: narrow ? 'Abrir menu' : 'Menu da conta de ' + name,
      toggle: () => this.setState({ open: !this.state.open }),
      onKey: (e) => { if (e.key === 'Escape') this.setState({ open: false }); },
      logout: () => api.logout().then(() => { if (this.props.onLogout) this.props.onLogout(); })
    };
  }
}
</script>
</body>
</html>
