<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Ana &amp; Pedro — Galeria</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#CDAE6B}a:hover{color:#E2C88E}
button{font-family:inherit}
@keyframes subir{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes zoom{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
.anim-up{animation:subir .8s cubic-bezier(.2,.7,.2,1) both}
.anim-zoom{animation:zoom .35s ease both}
@media (prefers-reduced-motion: reduce){.anim-up,.anim-zoom{animation:none}}
</style>
</helmet>
<div style="width: 390px; height: 844px; background: #1F3329; color: #F3EEE4; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden; position: relative">
  <main style="flex: 1 1 auto; overflow-y: auto; padding: 36px 20px 28px; display: flex; flex-direction: column; gap: 18px">
    <header class="anim-up" style="text-align: center; display: flex; flex-direction: column; gap: 6px">
      <span style="font-size: 11px; letter-spacing: 0.28em; text-transform: uppercase; color: #CDAE6B; font-weight: 600">Ana &amp; Pedro</span>
      <h1 style="margin: 0; font-family: 'Cormorant Garamond', Georgia, serif; font-size: 44px; line-height: 1.05; font-weight: 500">Nossa história</h1>
      <p style="margin: 0; font-size: 14px; color: #C3CCC1">Toque em uma foto para ampliar</p>
    </header>

    <a class="anim-up" href="https://www.youtube.com" style="display: block; border-radius: 16px; overflow: hidden; background: #14231C; color: #F3EEE4; text-decoration: none; animation-delay: .15s">
      <span style="aspect-ratio: 16 / 9; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px">
        <span style="width: 60px; height: 60px; border-radius: 50%; background: #CDAE6B; color: #1F3329; display: flex; align-items: center; justify-content: center">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"></path></svg>
        </span>
        <span style="font-size: 13px; color: #C3CCC1">Vídeo · 2:45 · YouTube</span>
      </span>
      <span style="display: block; padding: 12px 14px; font-weight: 600; font-size: 15px; background: #24392F">O pedido de casamento</span>
    </a>

    <div class="anim-up" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; animation-delay: .3s">
      <sc-for list="{{photos}}" as="p" hint-placeholder-count="6">
        <button onClick="{{p.open}}" aria-label="Ampliar foto: {{p.caption}}" style="padding: 0; border: 0; border-radius: 14px; overflow: hidden; background: #24392F; color: #F3EEE4; cursor: pointer; text-align: left; display: flex; flex-direction: column">
          <span style="height: {{p.h}}; background: {{p.tone}}; display: flex; align-items: center; justify-content: center; color: #C3CCC1">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v14H4zM4 16l5-5 5 5 2-2 4 4M15 9h.01"></path></svg>
          </span>
          <span style="padding: 8px 10px 10px; font-size: 13px; font-weight: 600; line-height: 1.3">{{p.caption}}</span>
        </button>
      </sc-for>
    </div>
  </main>

  <nav aria-label="Páginas do convite" style="flex: none; height: 68px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); background: #1A2C23; border-top: 1px solid #3C5A4B">
    <a href="ConviteCapa.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: #C3CCC1; font-size: 11px; font-weight: 600; text-decoration: none; border-top: 2px solid transparent">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7-4.5-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.5-7 10-7 10Z"></path></svg>Capa</a>
    <a href="ConviteDetalhes.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: #C3CCC1; font-size: 11px; font-weight: 600; text-decoration: none; border-top: 2px solid transparent">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11ZM12 12.5a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5Z"></path></svg>Detalhes</a>
    <a href="ConviteGaleria.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: #CDAE6B; font-size: 11px; font-weight: 700; text-decoration: none; border-top: 2px solid #CDAE6B">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v14H4zM4 16l5-5 5 5 2-2 4 4M15 9h.01"></path></svg>Galeria</a>
    <a href="ConviteRSVP.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: #C3CCC1; font-size: 11px; font-weight: 600; text-decoration: none; border-top: 2px solid transparent">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 11l3 3 8-8M20 12v7H4V5h11"></path></svg>Presença</a>
  </nav>

  <sc-if value="{{isOpen}}" hint-placeholder-val="{{ false }}">
    <div role="dialog" aria-modal="true" aria-label="Foto ampliada" style="position: absolute; inset: 0; background: rgba(10, 18, 14, 0.94); display: flex; flex-direction: column; padding: 20px 16px 28px; box-sizing: border-box; gap: 16px">
      <div style="display: flex; justify-content: space-between; align-items: center">
        <span style="font-size: 13px; color: #C3CCC1">{{counter}}</span>
        <button onClick="{{close}}" aria-label="Fechar" style="width: 44px; height: 44px; border-radius: 50%; border: 1px solid #3C5A4B; background: transparent; color: #F3EEE4; cursor: pointer; display: flex; align-items: center; justify-content: center">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg>
        </button>
      </div>
      <div class="anim-zoom" style="flex: 1 1 auto; border-radius: 16px; background: {{cur.tone}}; display: flex; align-items: center; justify-content: center; color: #C3CCC1">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v14H4zM4 16l5-5 5 5 2-2 4 4M15 9h.01"></path></svg>
      </div>
      <p style="margin: 0; text-align: center; font-family: 'Cormorant Garamond', Georgia, serif; font-size: 24px">{{cur.caption}}</p>
      <div style="display: flex; justify-content: center; gap: 12px">
        <button onClick="{{prev}}" aria-label="Foto anterior" style="width: 52px; height: 52px; border-radius: 50%; border: 1px solid #CDAE6B; background: transparent; color: #CDAE6B; cursor: pointer; display: flex; align-items: center; justify-content: center">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
        </button>
        <button onClick="{{next}}" aria-label="Próxima foto" style="width: 52px; height: 52px; border-radius: 50%; border: 0; background: #CDAE6B; color: #1F3329; cursor: pointer; display: flex; align-items: center; justify-content: center">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
        </button>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { open: -1 };
  }
  renderVals() {
    const base = [
      { caption: 'Primeiro encontro', h: '180px', tone: '#2B4538' },
      { caption: 'Primeira viagem juntos', h: '130px', tone: '#33503F' },
      { caption: 'O noivado', h: '130px', tone: '#33503F' },
      { caption: 'Com as famílias', h: '180px', tone: '#2B4538' },
      { caption: 'Nossa casa nova', h: '150px', tone: '#2E4A3B' },
      { caption: 'Ensaio pré-casamento', h: '150px', tone: '#2E4A3B' }
    ];
    const n = base.length;
    const photos = base.map((p, i) => Object.assign({}, p, { open: () => this.setState({ open: i }) }));
    const i = this.state.open;
    return {
      photos,
      isOpen: i >= 0,
      cur: i >= 0 ? base[i] : base[0],
      counter: i >= 0 ? (i + 1) + ' de ' + n : '',
      close: () => this.setState({ open: -1 }),
      prev: () => this.setState({ open: (i - 1 + n) % n }),
      next: () => this.setState({ open: (i + 1) % n })
    };
  }
}
</script>
</body>
</html>
